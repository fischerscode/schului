name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package the release
    uses: ./.github/workflows/ci.yml
    with:
      portable-package: true
  attach:
    name: Attach portable download
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable
          path: dist
      - name: Verify and attach release files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check schului-windows-x64.zip.sha256
          gh release upload --clobber -- "$RELEASE_TAG" schului-windows-x64.zip schului-windows-x64.zip.sha256
