name: schului
description: "Lernumgebungen unter Windows erstellen und interaktiv in echten Anwendungen lernen."
repository: https://github.com/fischerscode/schului
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.13.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  webview_windows: 0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: ^8.9.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/legal/

melos:
  sdkPath: .fvm/flutter_sdk
  useRootAsPackage: true
  command:
    version:
      workspaceChangelog: false
      versionPrivatePackages: true
      releaseUrl: true
      includeCommitId: true
      linkToCommits: true
  scripts:
    format: fvm dart format --output=none --set-exit-if-changed lib test
    analyze: fvm flutter analyze
    test: fvm flutter test
    build: fvm flutter build windows --release
